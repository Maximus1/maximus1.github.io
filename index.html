<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximus1 Portfolio</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #0366d6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        #repo-container {
            max-width: 800px;
            margin: 0 auto;
        }

        article {
            background: var(--card-bg);
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        article:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        h2 a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .meta {
            font-size: 0.85em;
            color: #6a737d;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 15px;
        }

        .tags {
            display: flex;
            gap: 10px;
            font-size: 0.8em;
        }

        .language {
            font-weight: bold;
            color: #586069;
        }
    </style>
</head>
<body>

<header>
    <h1>Meine Projekte</h1>
    <p>Eine Übersicht meiner GitHub Repositories als Artikel</p>
</header>

<main id="repo-container">
    <p>Lade Repositories...</p>
</main>

<script>
    const GITHUB_USERNAME = 'Maximus1a';

    async function fetchRepos() {
        const container = document.getElementById('repo-container');
        try {
            const response = await fetch(`<https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated>`);
            
            if (!response.ok) {
                throw new Error(`Fehler: ${response.status}`);
            }

            const repos = await response.json();
            container.innerHTML = ''; 

            repos
                .filter(repo => !repo.fork)
                .forEach(repo => {
                    const article = document.createElement('article');
                    
                    const date = new Date(repo.updated_at).toLocaleDateString('de-DE', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    article.innerHTML = `
                        <div class="meta">Zuletzt aktualisiert am ${date}</div>
                        <h2><a href="${repo.html_url}" target="_blank">${repo.name}</a></h2>
                        <p class="description">${repo.description || 'Keine Beschreibung verfügbar.'}</p>
                        <div class="tags">
                            <span class="language">${repo.language || ''}</span>
                            <span>⭐ ${repo.stargazers_count}</span>
                        </div>
                    `;
                    container.appendChild(article);
                });
        } catch (error) {
            console.error('Fehler beim Laden der Repos:', error);
            container.innerHTML = '<p>Fehler beim Laden der Repositories. Bitte prüfe die Konsole für Details.</p>';
        }
    }

    fetchRepos();
</script>

</body>
</html>
