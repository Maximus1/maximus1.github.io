<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximus1 Portfolio</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #0366d6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        #repo-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .search-container {
            margin-bottom: 30px;
        }

        article {
            background: var(--card-bg);
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        article:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        h2 a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .meta {
            font-size: 0.85em;
            color: #6a737d;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        .language {
            font-weight: bold;
            color: #586069;
        }

        .topic-tag {
            background: #e1ecf4;
            color: #39739d;
            padding: 2px 8px;
            border-radius: 12px;
        }

        #repo-search {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
        }
    </style>
</head>
<body>

<header>
    <h1>Meine Projekte</h1>
    <p>Eine Übersicht meiner GitHub Repositories als Artikel</p>
    <div class="search-container">
        <input type="text" id="repo-search" placeholder="Projekte durchsuchen (z.B. Python, Tools...)" />
    </div>
</header>

<main id="repo-container">
    <p>Lade Repositories...</p>
</main>

<script>
    const GITHUB_USERNAME = 'Maximus1';
    let allRepos = [];

    async function fetchRepos() {
        const container = document.getElementById('repo-container');
        try {
            const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated`);
            
            if (!response.ok) {
                throw new Error(`Fehler: ${response.status}`);
            }

            allRepos = await response.json();
            renderRepos(allRepos.filter(repo => !repo.fork && repo.name !== 'maximus1.github.io'));

        } catch (error) {
            console.error('Fehler beim Laden der Repos:', error);
            container.innerHTML = '<p>Fehler beim Laden der Repositories. Bitte prüfe die Konsole für Details.</p>';
        }
    }

    function renderRepos(repos) {
        const container = document.getElementById('repo-container');
            container.innerHTML = ''; 

        if (repos.length === 0) {
            container.innerHTML = '<p>Keine passenden Projekte gefunden.</p>';
            return;
        }

            repos
                .forEach(repo => {
                    const article = document.createElement('article');
                    
                    const date = new Date(repo.updated_at).toLocaleDateString('de-DE', {
                    year: 'numeric', month: 'short', day: 'numeric'
                    });

                const topics = repo.topics ? repo.topics.map(t => `<span class="topic-tag">${t}</span>`).join('') : '';

                    article.innerHTML = `
                    <div>
                        <div class="meta">Update: ${date}</div>
                        <h2><a href="${repo.html_url}" target="_blank">${repo.name.replace(/-/g, ' ')}</a></h2>
                        <p class="description">${repo.description || 'Projekt ohne Beschreibung.'}</p>
                    </div>
                    <div class="tags">
                        <span class="language">${repo.language || ''}</span>
                        ${topics}
                        <span>⭐ ${repo.stargazers_count}</span>
                    </div>
                    `;
                    container.appendChild(article);
                });
    }

    document.getElementById('repo-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allRepos.filter(repo => 
            !repo.fork && repo.name !== 'maximus1.github.io' &&
            (repo.name.toLowerCase().includes(term) || 
             (repo.description && repo.description.toLowerCase().includes(term)) ||
             (repo.language && repo.language.toLowerCase().includes(term)) ||
             (repo.topics && repo.topics.some(t => t.toLowerCase().includes(term))))
        );
        renderRepos(filtered);
    });

    fetchRepos();
</script>
</body>
</html>
